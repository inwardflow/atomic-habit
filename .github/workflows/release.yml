name: Release

# Publishes a release when a SemVer tag (vX.Y.Z or vX.Y.Z-rc.N) is pushed. See RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Verify and build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check tag matches project versions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom_version="$(cd backend && ./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          npm_version="$(node -p "require('./frontend/package.json').version")"
          echo "tag=$version pom=$pom_version npm=$npm_version"
          test "$version" = "$pom_version" || { echo "::error::Tag $version != backend/pom.xml $pom_version"; exit 1; }
          test "$version" = "$npm_version" || { echo "::error::Tag $version != frontend/package.json $npm_version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Backend - test and package
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Frontend - lint and build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Collect release assets
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "backend/target/atomic-habits-backend-${version}.jar" "dist/atomic-habits-backend-${version}.jar"
          tar -C frontend/dist -czf "dist/atomic-habits-frontend-${version}.tar.gz" .
          (cd dist && sha256sum * > SHA256SUMS)
          # Body of the "## [<version>]" section, up to the next section heading or the trailing
          # link references. Plain string matching: no regex escaping of brackets/dots needed.
          awk -v h="## [$version]" '
            index($0, h) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && substr($0, 1, 1) == "[" && index($0, "]: ") > 0 { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  images:
    name: Publish Docker images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          # Pre-releases get only their exact tag; stable releases also move X.Y and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.build.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.build.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=atomic-habit-${{ matrix.component }}
            org.opencontainers.image.licenses=MIT
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub Release
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.jar
            dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          {
            cat dist/RELEASE_NOTES.md
            echo
            echo "### Docker images"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE_PREFIX}-backend:${VERSION}"
            echo "docker pull ${IMAGE_PREFIX}-frontend:${VERSION}"
            echo '```'
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}" \
            dist/*.jar dist/*.tar.gz dist/SHA256SUMS
